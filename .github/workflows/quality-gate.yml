name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run evaluation harness
        run: pnpm eval
      - name: Deploy check (Vercel builds on push)
        run: echo "Vercel deployment is triggered by the Vercel Git integration."
